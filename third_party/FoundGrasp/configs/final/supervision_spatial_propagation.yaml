__base__: './foundgrasp_base.yaml'

# Table VII: spatial-only label propagation.
# Propagation stays enabled, but the depth-consistency gate is effectively
# disabled by using a threshold far above the dataset depth range. This isolates
# the value of depth-aware propagation from dense propagation itself.

training:
  loss_functions:
    propagate_gt: true
    prop_depth_thresh: 1000000.0
