__base__: './supervision_discrete_orientation.yaml'

# Table VII: fully discrete per-pixel grasp attributes.
# Orientation is joint view-angle CE; score, width, and depth are discretized
# with CE instead of continuous regression.

model:
  grasp_head:
    name: DiscreteJointAllAttributesGraspHead
    score_bins: 11
    width_bins: 21
    max_width: 0.10
    depth_values: [0.01, 0.02, 0.03, 0.04]
    attribute_decode: argmax

training:
  loss_functions:
    score:
      type: cross_entropy
      weight: 3.0
      normalize_by_log_classes: true
      max_samples: 65536
    width:
      type: cross_entropy
      weight: 1.0
      normalize_by_log_classes: true
      max_samples: 65536
    depth:
      type: cross_entropy
      weight: 1.0
      normalize_by_log_classes: true
      max_samples: 65536
