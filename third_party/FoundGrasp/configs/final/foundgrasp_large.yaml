__base__: './foundgrasp_base.yaml'

# Table I — Ours DAv2-L (GraspNet-1B, RealSense).
# Same recipe as ours.yaml; only the backbone scale and adapter width change.

model:
  backbone:
    name: depth-anything/Depth-Anything-V2-Large-hf
    freeze: true
  peft:
    bottleneck: 192
    drop_path: 0.3
training:
  batch_size: 64
  num_epochs: 150
  learning_rate: 7e-5