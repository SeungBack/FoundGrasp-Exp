__base__: '../ours_base.yaml'

# Table IV — Frozen backbone, no adapter. Isolates the freezing effect from the
# adapter effect (compare vs adapter_ft_noadapter and vs Ours).
# Also serves as Table VI "prediction-only" (head depth, no representation injection).

model:
  peft:
    type: 'none'

inference:
  palm_clearance: 0.010   # 축방향 손바닥 여유: 중심 -approach 10mm + depth +10mm (손끝 보존)
  width_clip: 0.1         # CD 전 평가자 규약 [0,0.1] clip
