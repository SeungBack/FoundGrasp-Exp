__base__: '../ours_base.yaml'

# Table IV — Frozen + Geo-ViT-Adapter (Depth SPM).

model:
  peft:
    type: 'geo_vit_adapter'
    num_interactions: 4
    num_heads: 6
    n_points: 4
    with_cffn: true
    cffn_ratio: 0.25
    deform_ratio: 0.5
    dropout: 0.0
    init_scale: 0.0
    add_level_embed: true
    use_extra_extractor: true
    spm_pool_factor: 2
    detach_depth: false

inference:
  palm_clearance: 0.010   # 축방향 손바닥 여유: 중심 -approach 10mm + depth +10mm (손끝 보존)
  width_clip: 0.1         # CD 전 평가자 규약 [0,0.1] clip
