__base__: '../ours_base.yaml'

# Table VII: replace prediction-aware multi-hypothesis assignment with the
# fixed top-1 target while retaining all other supervision components.

training:
  loss_functions:
    prediction_aware_assignment: false

inference:
  palm_clearance: 0.010   # 축방향 손바닥 여유: 중심 -approach 10mm + depth +10mm (손끝 보존)
  width_clip: 0.1         # CD 전 평가자 규약 [0,0.1] clip
