__base__: '../ours_base.yaml'

# Table IV — Full fine-tuning, no adapter.
# FT reference for the freezing argument (compare vs adapter_frozen_noadapter).
# LLRD 0.65가 FT의 기본 세팅 (adapter_ft_geoformer와 동일 근거).

model:
  backbone:
    freeze: false
  peft:
    type: 'none'

training:
  layer_decay_rate: 0.65

inference:
  palm_clearance: 0.010   # 축방향 손바닥 여유: 중심 -approach 10mm + depth +10mm (손끝 보존)
  width_clip: 0.1         # CD 전 평가자 규약 [0,0.1] clip
