__base__: '../ours_base.yaml'

# Table VI — Representation-level only: GeoFormer injects geometry inside the frozen
# ViT blocks, while the grasp head uses visual features only (no head depth fusion).

model:
  grasp_head:
    rgbd_fusion_type: 'none'

inference:
  palm_clearance: 0.010   # 축방향 손바닥 여유: 중심 -approach 10mm + depth +10mm (손끝 보존)
  width_clip: 0.1         # CD 전 평가자 규약 [0,0.1] clip
