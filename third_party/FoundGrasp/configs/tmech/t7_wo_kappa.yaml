__base__: './t7_wo_conf.yaml'

# Table VII R4 — Ablation: vMF kappa OFF
# Baseline (t7_wo_conf.yaml): propagate=true, confidence=false, use_kappa=true, angmf losses
# Change: use_kappa=false, switch to plain angular losses (no kappa required)

model:
  grasp_head:
    use_kappa: false

training:
  loss_functions:
    approach:
      type: acosine_similarity
      weight: 3.0
    gripper:
      type: symmetric_acosine_similarity
      weight: 3.0
