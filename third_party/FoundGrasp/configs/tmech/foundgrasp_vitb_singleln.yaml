__base__: './foundgrasp_vitb.yaml'

# Control for the double-LayerNorm question.
# foundgrasp_vitb (geoformer) leaves peft.use_ln unset -> RGBDAdapter defaults
# use_ln=True, so the visual stream is normed twice: adapter LN on top of the
# block's norm2. This control sets use_ln=false (single LN, matching the
# AdaptFormer/GRIP placement) to measure whether the extra LN moves AP.
# If ΔAP vs foundgrasp_vitb is within noise, keep all existing checkpoints as-is.
model:
  peft:
    use_ln: false
