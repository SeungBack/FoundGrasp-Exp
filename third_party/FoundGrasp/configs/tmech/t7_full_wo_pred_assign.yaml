__base__: './foundgrasp_vitb.yaml'

# Table VII(b) — Clean leave-one-out ablation from the confidence-weighted Full model.
# Replaces prediction-aware multimodal target assignment with a fixed top-1
# target while keeping propagation, confidence weighting, antipodal symmetry,
# and the kappa subsystem.

training:
  loss_functions:
    propagate_gt: true
    confidence_weighting: true
    prediction_aware_assignment: false
