__base__: './t7_discrete_view_angle.yaml'

# Table VII — GraspNet-style discrete parameter baseline on the image grid.
# Relative to t7_discrete_view_angle, score/width/depth regression is replaced
# by hard classification while the frozen VFM, GeoFormer, RGB-D fusion,
# propagation, and coherent fixed top-1 target assignment remain unchanged.

model:
  grasp_head:
    name: DiscreteJointAllAttributesGraspHead
    score_bins: 11
    width_bins: 21
    max_width: 0.10
    depth_values: [0.01, 0.02, 0.03, 0.04]
    attribute_decode: argmax

training:
  loss_functions:
    score:
      type: cross_entropy
      weight: 3.0
      normalize_by_log_classes: true
      max_samples: 65536
    width:
      type: cross_entropy
      weight: 1.0
      normalize_by_log_classes: true
      max_samples: 65536
    depth:
      type: cross_entropy
      weight: 1.0
      normalize_by_log_classes: true
      max_samples: 65536
