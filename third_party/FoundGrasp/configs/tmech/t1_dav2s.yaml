__base__: '../_base.yaml'

# Table I — FoundGrasp DAv2-Small (RealSense)
# Frozen DAv2-S backbone + GeoFormer adapter.

model:
  backbone:
    name: depth-anything/Depth-Anything-V2-Small-hf
    freeze: True
  peft:
    type: 'geoformer'
    bottleneck: 48
    drop_path: 0.1
    detach_depth: false
    scale: 1.0
