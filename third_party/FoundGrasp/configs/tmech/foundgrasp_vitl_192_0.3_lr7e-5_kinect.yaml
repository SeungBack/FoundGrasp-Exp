__base__: './t1_dav2l.yaml'

# Experiment A: isolate the DAv2-L first-tap fix.
# Baseline to compare: logs/tmech/foundgrasp_vitl_0.2
# Only change vs that baseline: Large DPT taps [5,11,17,23] -> [4,11,17,23].

model:
  decoder:
    name: DPT
    out_indices: [4, 11, 17, 23]
  peft:
    type: 'geoformer'
    detach_depth: false
    scale: 1.0
    bottleneck: 192
    drop_path: 0.3
  grasp_head:
    name: ParallelGraspHead

training:
  batch_size: 64
  num_epochs: 150
  learning_rate: 7e-5
  
dataset:
  name: GraspNet1B
  camera: 'kinect'