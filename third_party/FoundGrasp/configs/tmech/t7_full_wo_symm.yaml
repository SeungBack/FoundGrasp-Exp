__base__: './foundgrasp_vitb.yaml'

# Table VII(b) — Clean leave-one-out ablation from the confidence-weighted Full model.
# Removes gripper-axis antipodal symmetry while keeping propagation,
# confidence weighting, prediction-aware assignment, and the kappa subsystem.

training:
  loss_functions:
    propagate_gt: true
    confidence_weighting: true
    prediction_aware_assignment: true
    gripper:
      type: angmf
      weight: 3.0
