__base__: './dav2b.yaml'

# Table IV Row 9 — Frozen + GeoFormer (Ours)
# Also used as base for Table II DAv2-B (t2_dav2b_kinect) and Table VI Row 4 (t6_ours).

model:
  peft:
    type: 'geoformer'
    detach_depth: false
    scale: 1.0

training:
  loss_functions:
    propagate_gt: true
    confidence_weighting: false