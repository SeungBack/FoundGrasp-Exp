__base__: './dinov2b.yaml'

# Table V Row 4 — DINOv2-B, Full FT + GeoFormer
# DA-V2 confound control: if frozen > FT without depth pretraining, gain is from
# visual priors, not DAv2-specific geometry knowledge.

model:
  backbone:
    freeze: false
  peft:
    type: 'geoformer'
    detach_depth: false
    scale: 1.0
