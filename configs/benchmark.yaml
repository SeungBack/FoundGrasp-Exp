# Shared execution protocol for FoundGrasp / AnyGrasp / GFLA / RNGNet.
# Change only detector.name between runs. Motion/calibration come from default.yaml.
# FoundGrasp keeps its final width; the baselines receive the shared execution margin.
# GFLA additionally uses calibrated T_base_cam with table frame = robot base.
# This is not a byte-for-byte reproduction of the simulator's raw-width protocol.
base: default.yaml
detector:
  name: anygrasp
  foundgrasp:
    nms: true
    top_k: 50
  anygrasp:
    args: [--sdk_dir, ~/Workspaces/anygrasp_sdk,
           --checkpoint, ~/Workspaces/anygrasp_sdk/ckpts/checkpoint_detection.tar,
           --seed, '0', --gripper_height, '0.02']
postprocess:
  protocol: common
  collision:
    enabled: true
    voxel_size_m: 0.01
    approach_dist_m: 0.05
    thresh: 0.01
output:
  save_cycles: true
