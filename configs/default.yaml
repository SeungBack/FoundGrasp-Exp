# exp_foundgrasp 기본 설정 — 모든 동작 옵션은 이 파일에서 바꾼다.
#
#   실행 시 일시 변경:  python run.py --set floor_limit.enabled=true --set live.enabled=false
#   실험별 설정 파일:   configs/my_exp.yaml 에 `base: default.yaml` 을 두고 바꿀 항목만 기술
#   경로 항목은 프로젝트 루트(exp_foundgrasp/) 기준 상대 경로 허용.

# ---------------------------------------------------------------- 파지 검출 백엔드
# detector.name으로 방법 선택. FoundGrasp 독립 추론 경로의 후처리 예외는 아래 참조.
#   foundgrasp | economicgrasp | anygrasp | rngnet | hggd
#   FoundGrasp detector only: --set detector.foundgrasp.refiner.enabled=false
# 비교군은 각자의 conda 환경에서 워커로 돈다 (envs/setup_*.sh 로 생성).
# 체크포인트는 전부 RealSense 학습본 (D435).
detector:
  name: foundgrasp
  device: cuda
  warmup_runs: 1              # 로봇 연결 전에 초기 CUDA/추론 비용을 처리 (결과 미사용)
  foundgrasp:
    # 논문 최종 FoundGrasp-B (DAv2-B, configs/ours_base.yaml)
    config: third_party/FoundGrasp/configs/ours_base.yaml
    checkpoint: checkpoints/foundgrasp/final_model.pth
    # 독립 detect(): 원본 grasp NMS(5cm/30°), top-50, 폭 보정 적용
    collision_detection: true     # refiner를 끄면 쓰는 방법 고유 점군 CD (refiner는 자체 측정면 검사)
    collision_voxel_size: 0.01
    refiner:
      enabled: true               # false = FoundGrasp-Base (detector only)
      weights: checkpoints/foundgrasp/G_V_dpt_fonly.pt   # RealSense 검출기용 refiner
      env:                        # VERIFIER_* 덮어쓰기 (기본값은 efg/detectors/foundgrasp.py)
        VERIFIER_BODY: center     # 측정면 검사: 5mm 셀 중심이 몸체 내부일 때 검사 (overlap보다 덜 보수적)
  economicgrasp:
    conda_env: efg-economicgrasp
    script: ~/Workspaces/FoundGrasp/ext/EconomicGraspPrivate/sim_worker.py
    args: [--checkpoint, ~/Workspaces/EconomicGrasp/checkpoints/economicgrasp_realsense.tar]
  anygrasp:
    conda_env: efg-anygrasp
    script: workers/anygrasp_worker.py
    args: [--sdk_dir, ~/Workspaces/anygrasp_sdk,
           --checkpoint, ~/Workspaces/anygrasp_sdk/ckpts/checkpoint_detection.tar]
    poll_interval_s: 0.005     # 모델 내부 시간과 통신 포함 검출 시간은 별도로 기록
  rngnet:
    conda_env: efg-hggd
    script: ~/Workspaces/FoundGrasp/ext/RegionNormalizedGrasp/sim_worker.py
    args: [--checkpoint, ~/Workspaces/RegionNormalizedGrasp/checkpoints/realsense]
    pythonpath: [workers/shims]   # cupoch 이 sm_120 에서 안 돌 때의 대체 모듈 (설치돼 있으면 무시)
  hggd:
    conda_env: efg-hggd
    script: ~/Workspaces/FoundGrasp/ext/HGGD/sim_worker.py
    args: [--checkpoint, ~/Workspaces/HGGD/checkpoints/HGGD_realsense_checkpoint]
    pythonpath: [workers/shims]

# ---------------------------------------------------------------- 실행 후처리
# FoundGrasp 최종 폭은 그대로 사용. AnyGrasp 출력에는 실행 개방 여유 x1.2 적용.
# FoundGrasp 내부 decode는 x1.2 후 refiner가 폭을 재선택; AnyGrasp SDK 내부 배율은 비공개.
# AnyGrasp 및 나머지 raw-width 어댑터는 open_multiplier 적용.
# FoundGrasp는 독립 detect() 출력에 폭 한계·ROI·IK만 적용 (기각된 score<=0 제외).
# 공통 비교 설정은 benchmark.yaml. 상세: efg/postprocess.py
postprocess:
  roi_depth_mask: true        # 입력에서 scan_roi_px 밖 depth = 0
  max_open_m: 0.10           # 그리퍼 개방 한계 — 출력 폭이 이보다 큰 후보 배제. 플렉스 팁 실측 필요
  open_multiplier: 1.2        # AnyGrasp 및 비교군 실행 개방 마진. FoundGrasp에는 추가 적용 안 함
  collision:                  # 비교군 공유 충돌필터. FoundGrasp 독립 경로에서는 생략
    enabled: true
    backend: auto             # CUDA 가능 시 GPU 계산, 아니면 CPU (동일 Open3D voxel 점군)
    voxel_size_m: 0.01
    approach_dist_m: 0.043
    thresh: 0.001

# ---------------------------------------------------------------- 캘리브레이션ㅁㅁ
# (02.dev/hand_eye_calib 참조). intrinsics를 null로 두면 카메라 스트림 K 사용 —
# hand-eye와 같은 K를 써야 역투영 좌표가 일관된다.
calib:
  hand_eye: /home/user/r_foundgrasp/02.dev/hand_eye_calib/outputs/hand_eye_latest.yaml
  intrinsics: hand_eye        # 위 파일의 camera_intrinsics에서 K/D를 함께 읽음
  undistort: true             # OpenCV 보정 K/D로 RGB·정렬 depth를 같은 pinhole 좌표계로 변환

# ---------------------------------------------------------------- 로봇 (xArm7)
# TCP offset은 아래 실측값을 연결 시 적용·확인. TCP payload는 실제 그리퍼 질량/무게중심 설정.
robot:
  ip: "192.168.1.214"
  tcp_offset_mm_deg: [0, 0, 203, 0, 0, 0] # 플랜지→팁 끝 중앙. XYZ mm / RPY deg, 이동 전 적용
  # 스캔(홈) 자세 — 카메라가 박스 중심 상방에 수직으로 오도록
  # scripts/align_scan_pose.py(자동) 또는 teach_scan_pose.py(수동)로 갱신
  home_joints_deg: [-11.18, -22.16, -17.76, 77.08, -6.72, 98.24, -28.69]
  home_joint_speed_deg_s: 180 # 홈 복귀 조인트 속도 (deg/s), SDK 1.18.4 명령 상한
  home_joint_acc_deg_s2: 450  # 홈 복귀 가속도 (deg/s²)
  travel_speed_mm_s: 1000    # 홈 -> pre-grasp 이동 속도 상한 (mm/s)
  travel_acc_mm_s2: 1800     # 홈 -> pre-grasp 가속도; 잡기 직전 접근 가속도와 분리
  lift_speed_mm_s: 1000      # 복귀·자세 전환 공통 속도 상한 (mm/s)
  retreat_speed_mm_s: 850    # 파지 후 pre-grasp 복귀 속도 상한
  reorient_speed_mm_s: 1000  # pre-grasp 이후 상승 속도 상한 (grasp 모드는 파지 방향 유지)
  reorient_angular_speed_deg_s: 300 # 회전량/이동거리 기반 속도 산정 기준 (관절 속도 보장은 아님)
  reorient_acc_mm_s2: 1800   # pre-grasp 이후 상승·자세 전환 가속도
  rise_ik_step_mm: 20       # 상승 중간 자세 IK 검사 간격 (경로/특이점 통과 보장은 아님)
  rise_ik_step_deg: 5       # 병진·회전 중 더 촘촘한 간격 사용; 선정 시와 상승 전 재검사
  lift_acc_mm_s2: 800        # 파지 후 pre-grasp 복귀 가속도; 자유 공간 상승보다 낮게 유지
  approach_speed_mm_s: 250   # 잡기 직전 pre-grasp -> grasp 구간만 감속 (mm/s)
  approach_acc_mm_s2: 1100   # 잡기 직전 pre-grasp -> grasp 가속도
  pregrasp_blend_radius_mm: 20 # pre-grasp 통과 반경; 양쪽 구간 길이의 1/4 이하로 제한
  retreat_blend_radius_mm: 50 # 복귀 -> 상승 경유점 통과 반경; 길이의 1/4 이하로 제한
  approach_confirm_s: 0.05   # 파지점 도착·정지·빈 큐 연속 확인 시간 (0.04~1초)
  approach_timeout_s: 60     # 연속 접근 완료 대기 한도
  # tcp_payload: {weight_kg: 1.9, com_mm: [7, 1, 48]}   # 지정 시 연결마다 컨트롤러에 설정

# ---------------------------------------------------------------- 카메라 (D435)
camera:
  width: 1280
  height: 720
  fps: 30
  warmup_frames: 15
  frame_timeout_s: 2.0       # SDK 자동 재연결 대신 기한 내 프레임 수신 실패를 전달
  max_frame_age_s: 2.0        # 프레임 갱신 중단 시 다음 접근/홈 이동 차단
  shutdown_timeout_s: 10.0   # RSUSB 종료/드라이버 반환에 여유; 프레임 오류 감지 기한과 별개
  postprocess: true           # depth 후처리: disparity→spatial→temporal (RealSense 기본 파라미터)

# ---------------------------------------------------------------- 그리퍼 (KORAS 2FPA-I-03-100)
# 운용 규칙: 전원 투입 후 그리퍼 본체 버튼(I)으로 초기화. Modbus 초기화(101) 금지 —
# grip_close 방향 학습을 손상시키는 것이 실측 확인됨 (2026-07-21, 버튼 초기화로만 복구).
gripper:
  # by-id 고정 경로 — /dev/ttyACM* 번호는 재연결마다 바뀐다. 보드 교체 시 S/N 갱신
  # (`ls -l /dev/serial/by-id/`). 권한: 계정을 dialout 그룹에 추가
  port: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7A101355-if00"
  slave_id: 1
  grip_mode: "grip"           # "grip": 펌웨어 힘 제어(기본). "position": 위치 지정만 (펌웨어 이상 시 폴백)
  initialize_on_connect: false  # 반드시 false (위 운용 규칙)
  close_probe_on_connect: true  # 시작 시 홈 복귀 완료 후 close 방향 실측 점검, 통과해야 파지 사이클 시작
  force_pct: 80               # 그립 힘 (50~100)
  speed_pct: 100             # 그리퍼 API 속도 설정 상한 (100%)
  close_min_wait_s: 0.15     # 닫힘 시작 확인 후 최소 대기; 연속 3회 위치 안정도 필요
  open_min_wait_s: 0.2       # full 모드/연결 점검의 완전 개방 최소 대기; 도달·정지 확인 유지
  pre_open_min_wait_s: 0.15  # pre-grasp 폭 조절 최소 대기; 도달·정지 확인 유지
  pre_open_reconnect_timeout_s: 3.0 # 폭 조절 통신 실패 시 포트 재연결 시도 한도; 정상 확인 후 1회 재전송 (0=끔)
  release_mode: width        # width: 놓을 폭까지만 확인 후 복귀 / full: 완전 개방·정착 대기
  release_margin_mm: 5       # max(선정 개방 폭, 현재 파지 폭) + 여유 (전체 stroke 이하)
  release_confirm_s: 0.1    # 기준 폭 이상을 유지하는 시간; 시간만으로 놓았다고 판정하지 않음
  release_timeout_s: 5.0     # 최초 개방 명령부터 폭 확인까지 전체 한도 (재전송 포함)
  release_full_open_tolerance_mm: 2.0 # 최대 개방만 98mm 이상 허용 (100mm 도구); 일반 목표 오차는 별도
  stroke_mm: 100.0            # 전체 스트로크. 팁 교체 시 실측 갱신
  tip_length_mm: 80.0         # 시각화용 교체형 팁 전체 길이 (끝단 패드 포함)
  pre_open_margin_mm: 0       # postprocess에서 배율 적용한 개방 폭에 더할 여유
  grip_success_min_pct: 2.0   # close 후 finger 위치가 이보다 크면 파지 성공 (간격 판정).
                              # 플렉스 팁은 이 판정이 부정확 — payload_check 병용 또는
                              # grip_check.enabled: false 로 판정 미적용

# ---------------------------------------------------------------- 후보 선정
# score 순위대로 아래 기하·IK 조건을 처음 통과한 후보를 실행 (score 절대값 기준 없음)
selection:
  workspace_x_m: [0.15, 0.60]   # base 좌표계 작업 공간 (m) — 밖의 그립 지점 제외
  workspace_y_m: [-0.35, 0.35]
  workspace_z_m: [-0.01, 0.35]
  approach_max_tilt_deg: 25     # 접근 방향과 수직(base -z)의 최대 각도. 29°에서 self-collision 실측
  pre_grasp_offset_m: 0.10      # 접근 방향 반대로 물러난 pre-grasp 거리
  use_grasp_depth: true         # 검출기가 예측한 그립별 depth 반영
  approach_extra_m: 0.045      # 추가 삽입 45mm (+ 예측 depth). 팁 길이는 robot.tcp_offset_mm_deg로 보정
  lift_height_m: 0.1           # 높은 이송 경유점의 최소 높이 = grasp z + 이 값
  ik_check_per_candidate: true
  j7_limit_deg: [-89, 90]       # 파지·상승 대칭 후보 모두에 적용하는 J7 허용 범위 (케이블 꼬임 방지)
  j7_selection_margin_deg: 10 # 선정·파지점 재계획은 [-79,80]°; 실측도 여유 부족 시 닫기 전 재선정
  camera_up:                    # 손목 카메라 하향 자세 배제 (바닥·박스 충돌 방지)
    prefer: true                # 카메라 하향 제한 적용; 경로 관절비용 동률이면 상향 우선
    max_down_deg: 20            # 카메라 측면 방향이 수평 아래로 이보다 기울면 탈락

# ---------------------------------------------------------------- 작업 장면
# 스캔 영역 (컬러 이미지 픽셀 [x1, y1, x2, y2]) — 물체 박스 내부. scripts/set_roi.py 로 지정
scan_roi_px: [300, 100, 1000, 620]

# 릴리즈(놓는 박스 상방) 자세 — scripts/teach_drop.py 로 티칭
drop:
  joints_deg: [17.72, 7.1, 13.13, 82.38, -1.26, 76.13, 30.97]
  lift_orientation: grasp   # 각 높이에서 먼저 검사할 자세; grasp는 파지 자세 유지
                            # upright/home: 상승 중 수직/홈 자세로 회전하는 기존 모드
  route_search: true         # 높이·자세 대안을 낮은 경로부터 검사, 통과한 경로 실행
  height_search_step_m: 0.02 # 높이 탐색 최대 간격 20mm: 통상 목표 Z 260/280/300/320/340/360mm
  min_transfer_height_m: 0.25 # 이송 하한(base TCP z): 빈 10cm·적재물 고려한 사용자 지정 25cm
                              # null이면 via_height만 사용. 실제 목표에는 아래 높이 여유를 더함
  joint_speed_deg_s: 180      # 상승 정지 후 조인트 이송 상한 (사전 검사에서 필요 시 감속)
  joint_acc_deg_s2: 350       # 이송 가속도 (deg/s²)
  transfer_blend_radius_mm: 0 # 선형 상승→조인트 이송 혼합 연결에서 C24 재발: 상승 정지 확인 후 이송
  transfer_clearance_margin_mm: 10 # 높은 경유점 여유; 블렌딩 반경보다 작으면 반경만큼 확보
  transfer_timeout_s: 60     # 상승/이송 완료 대기 한도
  transfer_confirm_s: 0.05   # transfer_blend_radius_mm=0일 때 상승 도착·정지 확인 (0.04~1초)
  arrival_confirm_s: 0.05    # 릴리즈 관절 목표 도착·정지·빈 큐 확인 시간 (0.04~1초)
  via_height_m: 0.35          # 기존 기준 높이(base z, m). 경로 탐색은 min_transfer_height부터 낮은 순
                              # 각 후보는 max(grasp+lift_height, 후보 높이, pre-grasp+5cm)
                              # + max(높이 여유, 유효 블렌딩 반경). 실제 선택 높이는 로그에 출력

retry:
  max_inference_retries: 3    # 후보 0/선정 실패 시 새 프레임으로 추가 추론할 횟수
  no_candidate_wait_s: 2.0   # 자동 모드: 후보 소진 시 이 시간 대기 후 자동 재스캔
  max_fail_streak: 3          # 연속 실패/선정불가 한도 — 도달 시 사용자 입력 대기
  exclude_radius_m: 0.02      # 직전 실패 그립 지점 반경 내 후보 제외 (base 좌표계)

# ---------------------------------------------------------------- 파지 성공 판정
# false면 판정에 따른 실패 분기 없이 이송. finger 간격은 --verbose에서 확인.
# 판정 기준을 실측으로 잡는 동안의 자료 수집용
grip_check:
  enabled: false

# 릴리즈 자세에서 관절 중력 토크와 빈 손 기준값 비교 — 팁 변형과 무관한 판정.
# scripts/calib_payload.py 로 기준값 측정 후 enabled: true (릴리즈 자세 재티칭 시 재실행)
payload_check:
  enabled: false
  baseline_path: configs/calib/payload_baseline.npz
  min_delta_nm: null          # null이면 캘리브레이션 권장값 (샘플 물체 신호의 35%)
  samples: 12                 # 판정당 토크 표본 수 (중앙값)
  settle_s: 0.4               # 릴리즈 자세 도착 후 잔진동 안정화 대기

# ---------------------------------------------------------------- 안전 옵션
# 빈 박스 높이맵 기반 하강 제한 — scripts/scan_box_floor.py 로 맵 생성 후 enabled: true.
# 선정 그립의 TCP·핑거 끝이 (표면 z + clearance) 아래로 가지 않게 삽입량을 축소하고,
# min_insertion 밑으로 줄여야 하면 후보를 탈락시켜 재선정
floor_limit:
  enabled: false
  map_path: configs/calib/box_floor.npz
  clearance_m: 0.008
  min_insertion_m: 0.010

# ---------------------------------------------------------------- 모니터링·산출물
live:
  enabled: false              # OpenCV 라이브 창 (rerun으로 대체). 켜면 창에서 q로 정지 요청

# rerun 시각화: 실시간 뷰어 + output.dir/<실행이름>.rrd 기록. 정지는 터미널 Ctrl+C 1회
rerun:
  enabled: true
  viewer: native              # native(데스크톱 창 자동 실행) | web(브라우저) | none
  native_grpc_port: 9877      # 기존 웹 서버와 분리한 데스크톱 뷰어 연결 포트
  grpc_port: 9876             # 데이터 연결 고정 포트 — 실행마다 같은 뷰어 주소 사용
  web_port: 9090              # 웹 고정 포트 — 터미널의 전체 URL을 북마크
  save_rrd: true
  max_candidates: 25         # 시각화만 제한 (검출·선정 후보 수는 유지)
  point_radius_m: 0.0005     # 점군 점 반지름 0.5mm (기존 1.5mm)
  live_cloud_history: 3      # 파지용 스캔 + 이동 중 최신 N프레임 표시 (0=라이브 점군 끄기)
  live_cloud_hz: 5           # 라이브 점군 갱신 상한 (Hz); 추론 주기와 무관
  live_cloud_stride: 4       # 라이브 점군 픽셀 간격; 클수록 가벼움
  # TCP 그림 원점도 robot.tcp_offset_mm_deg 사용; 실로봇 연결 후에는 실제 판독값 사용

output:
  dir: outputs
  verbose: false             # true 또는 --verbose: refiner·필터·모션 상세 출력
  save_cycles: false          # true면 사이클별 후보/선정 오버레이 저장 (outputs/<실행이름>/cycleNNN_grasps.jpg)
